<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz — Diversité religieuse au travail</title>
<style>
:root{--navy:#15395c;--blue:#dce9f2;--cream:#f7f3eb;--beige:#eadcc7;--text:#243443;--green:#2f7658;--red:#a74747}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--text)}
.wrap{max-width:820px;margin:auto;padding:28px 18px 50px}.top{text-align:center;margin:16px 0 28px}
h1{font-family:Georgia,serif;color:var(--navy);font-size:clamp(32px,6vw,54px);margin:0 0 10px}.sub{font-size:17px}
.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 10px 35px #17395c18}
.progress{height:9px;background:#e8e8e8;border-radius:99px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:var(--navy);width:33.33%;transition:.3s}
.kicker{font-weight:700;color:#7a8791;margin-bottom:8px}.question{font-family:Georgia,serif;color:var(--navy);font-size:27px;line-height:1.25;margin:0 0 22px}
.answers{display:grid;gap:12px}.answer{border:2px solid #dbe2e7;background:#fff;padding:16px 18px;border-radius:15px;text-align:left;font-size:16px;cursor:pointer;transition:.15s}
.answer:hover{border-color:#8ca8bd;background:#f8fbfd}.answer.correct{border-color:var(--green);background:#edf7f1}.answer.wrong{border-color:var(--red);background:#fbefef}
.feedback{min-height:28px;margin:18px 0 0;font-weight:700}.ok{color:var(--green)}.no{color:var(--red)}
.actions{display:flex;justify-content:flex-end;margin-top:18px}.btn{border:0;background:var(--navy);color:#fff;border-radius:12px;padding:13px 22px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center;display:none}.score{font-family:Georgia,serif;color:var(--navy);font-size:64px;margin:12px}.pill{display:inline-block;background:var(--blue);padding:9px 15px;border-radius:99px;font-weight:700}.restart{margin-top:20px}
footer{text-align:center;color:#71808b;font-size:13px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
   <h1>Quiz</h1>
   <div class="sub">Diversité religieuse au travail — 3 questions</div>
 </div>
 <div class="card" id="quiz">
   <div class="progress"><div class="bar" id="bar"></div></div>
   <div class="kicker" id="count"></div>
   <div class="question" id="question"></div>
   <div class="answers" id="answers"></div>
   <div class="feedback" id="feedback"></div>
   <div class="actions"><button class="btn" id="next" disabled>Question suivante</button></div>
 </div>
 <div class="card result" id="result">
   <div class="pill">Quiz terminé</div>
   <div class="score" id="score"></div>
   <h2 id="message"></h2>
   <p>Merci d’avoir participé !</p>
   <button class="btn restart" onclick="restart()">Recommencer</button>
 </div>
 <footer>Respect • Ouverture • Inclusion</footer>
</div>
<script>
const questions=[
 {q:"Selon Brewer, quels besoins faut-il concilier pour favoriser l’inclusion ?",
  a:["Appartenance et individualité","Autorité et performance","Neutralité et hiérarchie","Compétition et uniformité"], c:0,
  f:"Brewer met en avant l’équilibre entre le besoin d’appartenance et le besoin de conserver son individualité."},
 {q:"En France, le principe de neutralité religieuse s’applique-t-il exactement de la même manière dans une entreprise privée et dans l’administration publique ?",
  a:["Oui","Non","Uniquement pour les managers","Uniquement dans les grandes entreprises"], c:1,
  f:"Le principe de neutralité ne s’applique pas de manière identique dans l’entreprise privée et dans l’administration publique."},
 {q:"Quelle est la première étape pour un manager face à une demande liée à la religion ?",
  a:["Refuser la demande","Décider immédiatement","Écouter et comprendre la demande","Appliquer automatiquement la même solution à tous"], c:2,
  f:"Le modèle présenté commence par ÉCOUTER : comprendre la demande avant de l’analyser et de rechercher une solution."}
];
let i=0,score=0,locked=false;
const qEl=document.getElementById("question"),aEl=document.getElementById("answers"),fEl=document.getElementById("feedback"),next=document.getElementById("next"),count=document.getElementById("count"),bar=document.getElementById("bar");
function render(){
 locked=false; next.disabled=true; fEl.textContent=""; fEl.className="feedback";
 count.textContent=`Question ${i+1} sur ${questions.length}`; qEl.textContent=questions[i].q; bar.style.width=`${(i+1)/questions.length*100}%`;
 aEl.innerHTML="";
 questions[i].a.forEach((x,n)=>{const b=document.createElement("button");b.className="answer";b.textContent=x;b.onclick=()=>choose(n,b);aEl.appendChild(b)});
 next.textContent=i===questions.length-1?"Voir mon score":"Question suivante";
}
function choose(n,b){
 if(locked)return; locked=true;
 [...aEl.children].forEach((x,k)=>{x.disabled=true;if(k===questions[i].c)x.classList.add("correct")});
 if(n===questions[i].c){score++;fEl.textContent="Bonne réponse ! "+questions[i].f;fEl.classList.add("ok")}
 else{b.classList.add("wrong");fEl.textContent="Pas tout à fait. "+questions[i].f;fEl.classList.add("no")}
 next.disabled=false;
}
next.onclick=()=>{if(i<questions.length-1){i++;render()}else finish()};
function finish(){
 document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="block";
 document.getElementById("score").textContent=`${score} / ${questions.length}`;
 document.getElementById("message").textContent=score===3?"Excellent !":score===2?"Très bien !":"Merci d’avoir participé !";
}
function restart(){i=0;score=0;document.getElementById("result").style.display="none";document.getElementById("quiz").style.display="block";render()}
render();
</script>
</body>
</html>
